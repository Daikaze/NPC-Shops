name: Validate and Package NPC Shops
on:
  push:
    branches: [main]
    paths:
      - module.json
      - .github/scripts/**
      - src/**
      - tests/**
      - package.json
      - styles/**
      - README.md
      - LICENSE
      - .github/workflows/release.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check && node --check .github/scripts/publish-foundry.mjs
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle module
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).version")
          mkdir -p dist/npc-shops
          cp module.json README.md LICENSE dist/npc-shops/
          cp -r src styles dist/npc-shops/
          (cd dist && zip -qr ../npc-shops.zip npc-shops)
      - name: Publish version-pinned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" npc-shops.zip module.json --clobber
          else
            gh release create "$TAG" npc-shops.zip module.json --title "NPC Shops $TAG" --notes "Security hardening; see README. V11/V14 live integration verification still required."
          fi
      - name: Register release in Foundry VTT official package catalog
        env:
          FOUNDRY_PACKAGE_RELEASE_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/publish-foundry.mjs
